name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tickets-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/tickets-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/tickets-api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  triage-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/triage-agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: [tickets-api, triage-agent]
    steps:
      - uses: actions/checkout@v4
      - run: docker build services/tickets-api
      - run: docker build services/triage-agent
