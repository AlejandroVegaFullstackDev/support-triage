name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tickets-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/tickets-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/tickets-api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  triage-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/triage-agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  end-to-end:
    runs-on: ubuntu-latest
    needs: [tickets-api, triage-agent, web]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build --detach --wait
      - run: ./scripts/smoke-test.sh
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
